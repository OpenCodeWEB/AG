# =============================================================================
# OpenCodeWEB Autonomous Agent Pipeline
#
# Runs on every push and PR to main/master:
#   1. Pre-mutation backup snapshot
#   2. Build & type-check (core + worker)
#   3. AST code audit (real scanner)
#   4. Auto-format with Prettier
#   5. Deploy worker (push to main only)
#   6. Commit changes with triple-authorship standard
# =============================================================================

name: OpenCodeWEB Autonomous Agent Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    types: [ opened, synchronize ]

jobs:
  execute-agent-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      deployments: write

    steps:
      # -----------------------------------------------------------------------
      #  Step 1 — Checkout with full depth for backup branch
      # -----------------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      #  Step 2 — Setup Node.js with npm cache
      # -----------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      # -----------------------------------------------------------------------
      #  Step 3 — Install dependencies (core + worker)
      # -----------------------------------------------------------------------
      - name: Install Dependencies
        run: |
          npm ci
          cd worker && npm ci

      # -----------------------------------------------------------------------
      #  Step 4 — Pre-Mutation Backup Snapshot
      # -----------------------------------------------------------------------
      - name: Establish Pre-Mutation Backup Snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          RESTORE_BRANCH="backup/opencode-ag-${TIMESTAMP}"
          echo "Creating backup snapshot branch: ${RESTORE_BRANCH}"

          git config user.name "ABsUP"
          git config user.email "ABsUP@users.noreply.github.com"

          # Create backup branch at current HEAD
          git branch "${RESTORE_BRANCH}"
          git push origin "${RESTORE_BRANCH}"

          # Record snapshot in ledger
          mkdir -p OpenCodeWEBsPRD
          cat >> OpenCodeWEBsPRD/ToDo.md <<-EOF

          ### Snapshot Ledger
          - **Branch:** \`${RESTORE_BRANCH}\`
          - **Date:** $(date)
          - **Commit:** ${{ github.sha }}
          EOF

      # -----------------------------------------------------------------------
      #  Step 5 — Build & TypeScript Verification
      # -----------------------------------------------------------------------
      - name: Build & Verification Script
        id: build
        run: |
          chmod +x ./scripts/build-engine.sh
          ./scripts/build-engine.sh

      # -----------------------------------------------------------------------
      #  Step 6 — AST Code Audit (real scanner)
      # -----------------------------------------------------------------------
      - name: Execute AST Code Review & ToDo Builder
        run: |
          echo "Running AST parsing and static code analysis..."
          npx tsx scripts/run-audit.ts

      # -----------------------------------------------------------------------
      #  Step 7 - Apply Safe Auto-Formatting
      # -----------------------------------------------------------------------
      - name: Apply Safe Auto-Fix Patches
        run: |
          echo "Applying automated syntax formatting and safe code fixes..."
          npx prettier --write "src/**/*.ts" || echo "Formatting skipped (no .ts files or prettier unavailable)"

      # -----------------------------------------------------------------------
      #  Step 8 - Secret Leak Prevention Scan
      # -----------------------------------------------------------------------
      - name: Secret Leak Prevention Scan
        run: |
          echo "Scanning for leaked credentials (AWS, GitHub, Slack, Stripe, Google, PEM keys)..."
          FAIL=0
          scan() {
            local pattern="$1" label="$2"
            local matches
            matches=$(grep -rInE "$pattern" \
              --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git \
              --exclude-dir=coverage --exclude-dir=.wrangler --exclude-dir=.github \
              --exclude="package-lock.json" --exclude="*.min.js" --exclude="*.map" \
              . 2>/dev/null || true)
            if [ -n "$matches" ]; then
              echo "::error::[$label] potential leak detected:"
              echo "$matches" | head -20
              FAIL=1
            fi
          }
          scan 'AKIA[0-9A-Z]{16}' "AWS Access Key"
          scan '-----BEGIN [A-Z ]*PRIVATE KEY-----' "Private PEM Key"
          scan 'ghp_[A-Za-z0-9]{36}' "GitHub PAT"
          scan 'github_pat_[A-Za-z0-9_]{22,}' "GitHub Fine-Grained PAT"
          scan 'xox[baprs]-[A-Za-z0-9-]{10,}' "Slack Token"
          scan 'sk_live_[0-9a-zA-Z]{16,}' "Stripe Secret Key"
          scan 'AIza[0-9A-Za-z_-]{35}' "Google API Key"
          if [ $FAIL -ne 0 ]; then
            echo "::error::Secret leak scan failed — remove leaked credentials before committing."
            exit 1
          fi
          echo "✅ No leaked secrets detected."

      # -----------------------------------------------------------------------
      #  Step 9 - Deploy Worker (push to main only)
      # -----------------------------------------------------------------------
      - name: Deploy Cloudflare Worker
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          cd worker
          npx wrangler deploy --minify

      # -----------------------------------------------------------------------
      #  Step 9b - Deploy Edge Gateway (opencodeweb.xup.workers.dev)
      # -----------------------------------------------------------------------
      - name: Deploy Cloudflare Gateway Worker
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          cd gateway
          npx wrangler deploy --minify

      # -----------------------------------------------------------------------
      #  Step 10 - Commit Changes (Dynamic User & Bot Co-Authorship)
      # -----------------------------------------------------------------------
      - name: Commit Changes (Dynamic User & Bot Co-Authorship)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            robot: OpenCodeWEB automated audit, test, and optimization [skip ci]

            Co-authored-by: opencodeweb[bot] <311941023+opencodeweb[bot]@users.noreply.github.com>
            Co-authored-by: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
          branch: ${{ github.head_ref || github.ref_name }}
          commit_author: "opencodeweb[bot] <311941023+opencodeweb[bot]@users.noreply.github.com>"
          commit_user_name: "opencodeweb[bot]"
          commit_user_email: "311941023+opencodeweb[bot]@users.noreply.github.com"
